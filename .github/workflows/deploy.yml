name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Upload via explicit FTPS
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_PASSWORD" || { echo 'Set the FTP_PASSWORD repository secret first.'; exit 1; }
          lftp --env-password -u 'admin@darulmuthiah.com' -e 'set cmd:fail-exit true; set net:timeout 15; set net:max-retries 2; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; mirror --reverse --verbose --exclude-glob *.html dist/ ./; mirror --reverse --verbose --include-glob */ --include-glob *.html dist/ ./; bye' ftp://ftp.darulmuthiah.com
